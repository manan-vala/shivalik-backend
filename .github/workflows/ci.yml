name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The suite runs against real PostgreSQL. On SQLite the concurrency
    # tests skip themselves and prove nothing.
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: shivalik
          POSTGRES_USER: shivalik
          POSTGRES_PASSWORD: shivalik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shivalik -d shivalik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-used-anywhere-else
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_ENGINE: postgresql
      DB_NAME: shivalik
      DB_USER: shivalik
      DB_PASSWORD: shivalik
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Django 5.0 supports Python 3.10–3.12 only; 3.12 is the newest it
          # supports. Keep this in step with the Django pin in requirements.txt.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Everything below is ordered cheapest-first, so a broken PR fails in
      # seconds rather than after the whole suite.

      - name: Django system checks
        run: python manage.py check --fail-level WARNING

      - name: No un-generated migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Migrations apply cleanly
        run: python manage.py migrate --noinput

      # The gate: six checks covering the invariants every team depends on —
      # the API is closed, stock moves only through the engine, overselling
      # is a 400, the ledger reconciles, the core routes answer, and the
      # OpenAPI contract still generates. ~3s. If this is red, nothing else
      # is worth reading. See inventory/tests/test_smoke.py.
      - name: Smoke tests
        run: pytest -m smoke

      - name: Full test suite
        run: pytest
