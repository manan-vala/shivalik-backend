# Local PostgreSQL, so nobody has to install a server to satisfy Q2.
#
#   docker compose up -d db      # start
#   docker compose down          # stop, keeping data
#   docker compose down -v       # stop and wipe the volume
#
# Credentials match the defaults in .env.example.
#
# Already running something else on 5432 — another project's container, or a
# Postgres you installed directly? Publish this one somewhere else instead of
# fighting over the port, and point the app at it:
#
#   DB_PORT_HOST=5433 docker compose up -d db
#   # then set DB_PORT=5433 in your .env
#
# The default is unchanged, so this is invisible unless you need it.

services:
  db:
    image: postgres:16-alpine
    container_name: shivalik-db
    environment:
      POSTGRES_DB: shivalik
      POSTGRES_USER: shivalik
      POSTGRES_PASSWORD: shivalik
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shivalik -d shivalik"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
